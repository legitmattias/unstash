# Staging overrides — GHCR images tagged :staging, host ports 8010/3510 for same-host
# coexistence with production, lower resource limits.
# Secrets supplied by the host at $SECRETS_DIR; see ADR 0003.
#
# Usage (from CI):
#   DOCKER_HOST=ssh://... SECRETS_DIR=... docker compose -p unstash-staging \
#     -f compose.yaml -f compose.staging.yaml up -d

services:
  api:
    image: ${API_IMAGE:?API_IMAGE must be set to the api image repository}:${IMAGE_TAG:-staging}
    ports:
      - "127.0.0.1:8010:8000"
    secrets:
      - database_password
      - database_admin_password
      - session_secret
      - encryption_key
      # Search embeds queries and reranks results from the API process.
      - jina_api_key
    environment:
      UNSTASH_ENVIRONMENT: staging
      UNSTASH_DEBUG: "false"
      UNSTASH_LOG_LEVEL: DEBUG
      # Query embedding and reranking run on the self-hosted inference
      # service. Reranking the top 10 scores the same as the top 20 at
      # half the time.
      UNSTASH_EMBEDDER_BACKEND: local
      UNSTASH_RERANKER_BACKEND: local
      UNSTASH_SEARCH_RERANK_CANDIDATES: "10"
    volumes:
      - ${DOCUMENTS_DIR:?DOCUMENTS_DIR must be the host directory holding uploaded documents}:/var/unstash/documents
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.75"

  frontend:
    image: ${WEB_IMAGE:?WEB_IMAGE must be set to the web image repository}:${IMAGE_TAG:-staging}
    ports:
      - "127.0.0.1:3510:3000"
    environment:
      NODE_ENV: production
      # Server-side (RSC / route handlers) reach the API over the internal
      # network; browser /api calls go through Caddy.
      API_INTERNAL_ORIGIN: http://api:8000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.5"

  worker:
    image: ${API_IMAGE:?API_IMAGE must be set to the api image repository}:${IMAGE_TAG:-staging}
    secrets:
      - database_password
      - mistral_api_key
      - jina_api_key
      - ner_api_key
    environment:
      UNSTASH_ENVIRONMENT: staging
      UNSTASH_EMBEDDER_BACKEND: local
      UNSTASH_OCR_BACKEND: mistral
      UNSTASH_NER_BACKEND: hf
      UNSTASH_NER_ENDPOINT_URL: ${NER_ENDPOINT_URL:?NER_ENDPOINT_URL must be set when UNSTASH_NER_BACKEND=hf}
      UNSTASH_LABELER_BACKEND: hosted
      UNSTASH_DEBUG: "false"
      UNSTASH_LOG_LEVEL: DEBUG
    volumes:
      - ${DOCUMENTS_DIR:?DOCUMENTS_DIR must be the host directory holding uploaded documents}:/var/unstash/documents
      # HuggingFace + Docling model cache (~3 GB after first parse).
      # Named volume so the download survives container recreates.
      - worker_model_cache:/home/unstash/.cache
    # Each running task holds a database connection for its whole run and
    # a parse holds its document in memory, so concurrency is bounded well
    # below the connection pool (taskiq's default is 100 tasks at once).
    command: ["taskiq", "worker", "--workers", "1", "--max-async-tasks", "2", "unstash.tasks:broker"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # One worker process loading Docling layout + tableformer
          # models needs ~2 GB resident. Headroom for parse buffers.
          memory: 2500M
          cpus: "1.0"

  inference:
    # Self-hosted embedding and reranking models. Same image as api;
    # differs only in command. Internal network only, never published:
    # the service is unauthenticated. It mounts no secrets and has no
    # database access.
    image: ${API_IMAGE:?API_IMAGE must be set to the api image repository}:${IMAGE_TAG:-staging}
    command: ["uvicorn", "--factory", "unstash.inference_server.app:create_app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      # Matches the CPU limit below.
      UNSTASH_INFERENCE_THREADS: "6"
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      # Model weights (~4.5 GB), downloaded on first start.
      - inference_model_cache:/home/unstash/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      # The server listens only after both models are loaded; the first
      # start also downloads them.
      start_period: 900s
      retries: 3
    restart: unless-stopped
    networks:
      - internal
    deploy:
      resources:
        limits:
          # Both models resident (~5 GB) plus inference buffers.
          memory: 6500M
          cpus: "6.0"

  migrate:
    image: ${API_IMAGE:?API_IMAGE must be set to the api image repository}:${IMAGE_TAG:-staging}
    secrets:
      - database_migrations_password
    environment:
      UNSTASH_ENVIRONMENT: staging

  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be set to the postgres image repository}:${IMAGE_TAG:-staging}
    secrets:
      - database_password
      - database_migrations_password
      - database_admin_password
      - postgres_superuser_password
    environment:
      POSTGRES_DB: unstash
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  redis:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  gotenberg:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # LibreOffice spins up per conversion; idle cost is low. The
          # cap contains a runaway conversion on the shared host.
          memory: 512M
          cpus: "0.5"

volumes:
  worker_model_cache:
  inference_model_cache:

secrets:
  database_password:
    file: ${SECRETS_DIR:?SECRETS_DIR must point to the host directory holding the secret files}/database_password
  database_migrations_password:
    file: ${SECRETS_DIR}/database_migrations_password
  database_admin_password:
    file: ${SECRETS_DIR}/database_admin_password
  postgres_superuser_password:
    file: ${SECRETS_DIR}/postgres_superuser_password
  session_secret:
    file: ${SECRETS_DIR}/session_secret
  encryption_key:
    file: ${SECRETS_DIR}/encryption_key
  mistral_api_key:
    file: ${SECRETS_DIR}/mistral_api_key
  jina_api_key:
    file: ${SECRETS_DIR}/jina_api_key
  ner_api_key:
    file: ${SECRETS_DIR}/ner_api_key
