# Base Docker Compose configuration for Unstash.
# Use with an override file:
#   Dev:  docker compose -f compose.yaml -f compose.dev.yaml up
#   Prod: docker compose -f compose.yaml -f compose.production.yaml up -d

name: unstash

services:
  api:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    environment:
      UNSTASH_DATABASE_HOST: postgres
      UNSTASH_DATABASE_PORT: "5432"
      UNSTASH_DATABASE_NAME: unstash
      UNSTASH_DATABASE_USER: unstash_app
      UNSTASH_REDIS_HOST: redis
      UNSTASH_REDIS_PORT: "6379"
    networks:
      - internal

  frontend:
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  worker:
    # Same image as api; differs only in command. Pulls jobs from the
    # Redis broker and runs them with the per-job org context set via
    # unstash.tasks.org_context.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    environment:
      UNSTASH_DATABASE_HOST: postgres
      UNSTASH_DATABASE_PORT: "5432"
      UNSTASH_DATABASE_NAME: unstash
      UNSTASH_DATABASE_USER: unstash_app
      UNSTASH_REDIS_HOST: redis
      UNSTASH_REDIS_PORT: "6379"
    networks:
      - internal

  migrate:
    # One-shot schema migration, run before the application starts:
    #   docker compose ... run --rm migrate
    # The only service that mounts the schema-owner credential. Behind a
    # profile so `up` never starts it.
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      UNSTASH_DATABASE_HOST: postgres
      UNSTASH_DATABASE_PORT: "5432"
      UNSTASH_DATABASE_NAME: unstash
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks:
      - internal

  postgres:
    image: postgres:17
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Healthy means the application role exists, not only that the server
      # accepts connections: a first boot whose init script failed leaves a
      # server that starts normally with no application roles.
      test:
        - CMD-SHELL
        - >-
          psql -U postgres -d unstash -Atc
          "SELECT 1 FROM pg_roles WHERE rolname = 'unstash_app'" | grep -qx 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  gotenberg:
    # LibreOffice-only variant: converts legacy office formats to PDF
    # for the worker's CONVERT_THEN_EXTRACT path. No Chromium (we don't
    # render HTML), so ~38% smaller than the full image. Pinned because
    # the bundled LibreOffice moves fast.
    image: gotenberg/gotenberg:8.40.0-libreoffice
    # Internal network only, never published. The conversion API runs
    # LibreOffice on uploaded bytes, so it must not be reachable from
    # outside the compose network.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - internal

volumes:
  pgdata:
  redisdata:

networks:
  internal:
    driver: bridge
