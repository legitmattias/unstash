name: Deploy

on:
  push:
    branches: [development, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to re-deploy (manual redeploy of current branch head)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/legitmattias/unstash-api
  WEB_IMAGE: ghcr.io/legitmattias/unstash-web
  POSTGRES_IMAGE: ghcr.io/legitmattias/unstash-postgres

jobs:
  # ── Gate: CI must pass before anything else runs ─────────
  ci:
    uses: ./.github/workflows/ci.yaml
    # This is the trusted post-merge path; passing secrets here lets the
    # live-API contract tests run before a deploy. pull_request runs of
    # ci.yaml do not inherit these (see the integration-test env gating).
    secrets: inherit

  # ── Build and push Docker images to GHCR ─────────────────
  build-and-push:
    timeout-minutes: 20
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:staging
            ${{ env.API_IMAGE }}:production
          cache-from: type=registry,ref=${{ env.API_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.API_IMAGE }}:buildcache,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:staging
            ${{ env.WEB_IMAGE }}:production
          cache-from: type=registry,ref=${{ env.WEB_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.WEB_IMAGE }}:buildcache,mode=max

      - name: Build and push Postgres image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/postgres.Dockerfile
          push: true
          tags: |
            ${{ env.POSTGRES_IMAGE }}:${{ github.sha }}
            ${{ env.POSTGRES_IMAGE }}:staging
            ${{ env.POSTGRES_IMAGE }}:production
          cache-from: type=registry,ref=${{ env.POSTGRES_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.POSTGRES_IMAGE }}:buildcache,mode=max

  # ── Deploy to staging (auto on push to development) ──────
  deploy-staging:
    timeout-minutes: 15
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: staging
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/development') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          printf 'Host %s\n  IdentityFile %s\n' \
            "${{ secrets.DEPLOY_HOST }}" "$HOME/.ssh/deploy_key" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy
        env:
          DOCKER_HOST: ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          API_IMAGE: ${{ env.API_IMAGE }}
          WEB_IMAGE: ${{ env.WEB_IMAGE }}
          POSTGRES_IMAGE: ${{ env.POSTGRES_IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
          ORIGIN: ${{ vars.ORIGIN }}
          SECRETS_DIR: ${{ vars.SECRETS_DIR }}
          NER_ENDPOINT_URL: ${{ vars.NER_ENDPOINT_URL }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          # Free space for the incoming images before pulling; unused
          # images are re-pullable from GHCR, running containers keep
          # theirs. The host disk cannot hold many image generations.
          docker image prune -a -f
          docker compose -p unstash-staging -f compose.yaml -f compose.staging.yaml pull
          # Migrations must complete before the new app code starts serving.
          docker compose -p unstash-staging -f compose.yaml -f compose.staging.yaml up -d postgres redis
          docker compose -p unstash-staging -f compose.yaml -f compose.staging.yaml run --rm api alembic upgrade head
          docker compose -p unstash-staging -f compose.yaml -f compose.staging.yaml up -d

      - name: Prune old images
        env:
          DOCKER_HOST: ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: docker image prune -a -f

      - name: Health check
        run: |
          echo "Waiting for services to start..."
          sleep 10
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'curl -sf http://localhost:8010/api/ready || (echo "API readiness check failed" && exit 1)'
          echo "Staging deploy complete."

  # ── End-to-end smoke against staging (login → search → click) ──────────
  # Runs after the staging deploy. No-ops cleanly until SMOKE_EMAIL /
  # SMOKE_PASSWORD are set as staging-environment secrets.
  e2e-staging:
    timeout-minutes: 15
    needs: deploy-staging
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Check smoke credentials are configured
        id: creds
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
        run: echo "present=${SMOKE_EMAIL:+true}" >> "$GITHUB_OUTPUT"

      - if: steps.creds.outputs.present == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - if: steps.creds.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        if: steps.creds.outputs.present == 'true'
        working-directory: frontend
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Install the Playwright browser
        if: steps.creds.outputs.present == 'true'
        working-directory: frontend
        timeout-minutes: 6
        env:
          # --with-deps runs apt-get; without this it can block on a prompt
          # that no one is there to answer.
          DEBIAN_FRONTEND: noninteractive
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e smoke against staging
        if: steps.creds.outputs.present == 'true'
        working-directory: frontend
        timeout-minutes: 6
        env:
          SMOKE_BASE_URL: https://staging.unstash.mattic.dev
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: pnpm e2e

  # ── Deploy to production (auto on push to main) ──────────
  deploy-production:
    timeout-minutes: 15
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: production
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          printf 'Host %s\n  IdentityFile %s\n' \
            "${{ secrets.DEPLOY_HOST }}" "$HOME/.ssh/deploy_key" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy
        env:
          DOCKER_HOST: ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          API_IMAGE: ${{ env.API_IMAGE }}
          WEB_IMAGE: ${{ env.WEB_IMAGE }}
          POSTGRES_IMAGE: ${{ env.POSTGRES_IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
          ORIGIN: ${{ vars.ORIGIN }}
          SECRETS_DIR: ${{ vars.SECRETS_DIR }}
          NER_ENDPOINT_URL: ${{ vars.NER_ENDPOINT_URL }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          # Free space for the incoming images before pulling; unused
          # images are re-pullable from GHCR, running containers keep
          # theirs. The host disk cannot hold many image generations.
          docker image prune -a -f
          docker compose -p unstash-production -f compose.yaml -f compose.production.yaml pull
          # Migrations must complete before the new app code starts serving.
          docker compose -p unstash-production -f compose.yaml -f compose.production.yaml up -d postgres redis
          docker compose -p unstash-production -f compose.yaml -f compose.production.yaml run --rm api alembic upgrade head
          docker compose -p unstash-production -f compose.yaml -f compose.production.yaml up -d

      - name: Prune old images
        env:
          DOCKER_HOST: ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: docker image prune -a -f

      - name: Health check
        run: |
          echo "Waiting for services to start..."
          sleep 10
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'curl -sf http://localhost:8000/api/ready || (echo "API readiness check failed" && exit 1)'
          echo "Production deploy complete."
